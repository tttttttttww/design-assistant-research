<body><main class="cover"><section class="cover-copy"><span class="eyebrow">DESIGN THINKING WORKSHOP</span><h1>设计思维<span>工作坊</span></h1><p>从真实需要出发，设计真正有用的东西。任务、作品和AI记录都会连接到你的固定学生编号。</p></section><section class="card cover-card"><span class="eyebrow">进入本节任务</span><h2>输入你的学生编号和姓名</h2><p class="small">请对照老师展示的名单填写。系统会同时核对“编号 + 姓名”，避免误进别人的记录；后面即使分组，你的编号也不会改变。</p><form id="loginForm" class="form"><label>学生编号<input id="participantId" placeholder="例如 S01" autocomplete="off" maxlength="3" required></label><label>姓名<input id="studentName" placeholder="请输入你的姓名" autocomplete="off" maxlength="30" required></label><div id="error" class="notice warn hidden"></div><button class="btn" type="submit">进入设计平台 →</button></form><div class="teacher-entry teacher-entry-simple"><a class="btn ghost teacher-btn" href="/admin.html">进入教师后台</a></div></section></main><script src="/js/common.js?v=11.18"></script><script src="/js/index.js?v=11.18"></script></body></html>
