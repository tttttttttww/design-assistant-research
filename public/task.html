<header class="topbar"><div class="brand">设计思维工作坊</div><div class="row"><div class="participant-tag" data-participant-tag></div><details id="screenRecordingTools" class="screen-recording-tools"><summary id="screenRecordingToggle">可选录屏</summary><div class="screen-recording-menu"><p><strong>仅在学校已完成必要授权后使用。</strong>请只选择当前平台标签页；不录声音，不上传到服务器，录像由本设备保存。</p><label class="screen-recorder-consent"><input type="checkbox" id="screenRecordingConsent">教师已确认录屏授权，我知道可以停止录制</label><div class="row"><button class="btn secondary mini" id="screenRecordingStart" type="button" disabled>开始录屏</button><button class="btn secondary mini hidden" id="screenRecordingStop" type="button">停止录屏</button><button class="btn mini hidden" id="screenRecordingDownload" type="button">保存录像</button></div><p id="screenRecordingStatus" role="status" aria-live="polite" class="small">尚未开始录屏。录制期间请勿切换到私人应用。</p></div></details><button class="btn ghost mini" id="switchStudent" type="button">换学生 / 退出</button></div></header>
